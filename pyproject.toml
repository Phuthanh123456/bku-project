[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envi-nmt"
version = "0.1.0"
description = "English-Vietnamese NMT using a from-scratch modern Transformer (RoPE, RMSNorm, SwiGLU)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: bài test chạy lâu (overfit 50 câu, benchmark). Bỏ qua bằng: pytest -m 'not slow'",
    "gpu: bài test cần GPU, tự skip khi không có CUDA",
]
